<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C1015">
<title>Multiview Audio</title>
<style>
:root{--bg:#0C1015;--surface:#151B23;--surface2:#1D2530;--line:#2A3441;--text:#E8EDF3;--muted:#8A96A6;--accent:#2BD9A0;--amber:#F5A524;--blue:#6CB4FF;--red:#FF6B6B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--text);font:16px/1.35 system-ui,-apple-system,Roboto,sans-serif;padding:16px 16px 48px}
h1{font-size:24px;margin:4px 0 2px}
.muted{color:var(--muted)}.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:96px;cursor:pointer}
.box.sound{border:2px solid var(--accent);background:rgba(43,217,160,.10)}
.box .top{display:flex;align-items:center;gap:6px}
.box .num{color:var(--muted);font-size:12px;font-weight:700}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px}
.chip.LIVE{color:var(--accent);background:rgba(43,217,160,.14)}
.chip.BREAK{color:var(--amber);background:rgba(245,165,36,.14)}
.chip.FINAL,.chip.EMPTY,.chip.NONE{color:var(--muted);background:rgba(138,150,166,.14)}
.chip.LATER,.chip.OTHER,.chip.HALFTIME{color:var(--blue);background:rgba(108,180,255,.14)}
.chip.NOGAME{color:var(--amber);background:rgba(245,165,36,.14)}
.box .name{font-weight:600;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box .detail,.box .cam{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box .cam.game{color:var(--accent)}.box .cam.commercial{color:var(--amber)}.box .cam.show{color:var(--blue)}
.sound-tag{margin-left:auto;font-size:12px;color:var(--accent);font-weight:700}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:12px;padding:12px;font:600 16px system-ui,-apple-system,Roboto,sans-serif;width:100%;cursor:pointer}
.btn:active{opacity:.7}
.big{height:66px;font-size:18px}
.ad{border-color:var(--amber);color:var(--amber)}.game{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}
#ask{border-color:var(--blue);color:var(--blue)}
#ask .row .btn{border-color:var(--blue);color:var(--blue)}
.meter{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:8px}
.meter>div{height:100%;background:var(--accent);width:0}
.log div{display:flex;gap:10px;padding:5px 0;font-size:13px;color:var(--muted)}
.log div:first-child{color:var(--text)}
.log span:first-child{flex:0 0 62px}
summary{cursor:pointer;font-weight:600}
.camwrap{position:relative;margin-top:10px}
.camwrap img{width:100%;display:block;border-radius:10px;background:#000}
.camwrap canvas{position:absolute;left:0;top:0;width:100%;height:100%}
textarea{width:100%;height:160px;margin-top:10px;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;font:12px ui-monospace,monospace}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#sheet .card{background:var(--surface2);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px 28px}
#sheet .card .btn{margin-top:10px}
#toast{position:fixed;left:16px;right:16px;bottom:18px;max-width:528px;margin:0 auto;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<h1>Multiview Audio</h1>
<div id="status" class="muted">Connecting to the camera phone…</div>

<div id="ask" class="panel" hidden>
  <div id="askText"></div>
  <div class="row"><button class="btn" data-a="yes">Yes</button><button class="btn" data-a="no">No</button></div>
</div>

<div class="grid" id="grid"></div>

<div class="row">
  <button class="btn big ad" data-a="ad">It's an ad</button>
  <button class="btn big game" data-a="game">It's the game</button>
</div>

<div class="panel">
  <div id="heard">Not listening</div>
  <div id="why" class="small muted"></div>
  <div class="meter"><div id="meter"></div></div>
</div>

<div class="row">
  <button class="btn" id="pause">Pause</button>
  <button class="btn" id="startstop">Start</button>
</div>

<details class="panel" id="camPanel">
  <summary>Camera view</summary>
  <div class="camwrap"><img id="cam" alt=""><canvas id="ov"></canvas></div>
  <div class="row"><button class="btn" data-a="find">Find the TV again</button></div>
</details>

<div class="panel">
  <div class="muted small">Activity</div>
  <div class="log" id="log"></div>
</div>

<div class="row"><button class="btn" id="diag">Copy diagnostics</button></div>
<textarea id="report" hidden readonly></textarea>

<div id="sheet" hidden>
  <div class="card">
    <div id="sheetTitle" style="font-weight:700;font-size:18px"></div>
    <button class="btn game" id="sPlay">Play audio from this box</button>
    <button class="btn" id="sOn">Sound is already on this box</button>
    <button class="btn" id="sLock">Lock here</button>
    <button class="btn" id="sCancel">Cancel</button>
  </div>
</div>
<div id="toast"></div>

<script>
const K = new URLSearchParams(location.search).get('k') || '';
let S = null, sheetBox = 0, failures = 0;
const $ = id => document.getElementById(id);

function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2600); }

async function act(a, n) {
  try {
    const r = await fetch('/do?k=' + encodeURIComponent(K) + '&a=' + a + (n ? '&n=' + n : ''), { method: 'POST' });
    const j = await r.json();
    if (!j.ok && j.error) toast(j.error);
    else if (a === 'ad') toast('Got it, commercial.');
    else if (a === 'game') toast('Got it, game.');
  } catch (e) { toast("Couldn't reach the camera phone."); }
  poll();
}

document.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => act(b.dataset.a)));
$('pause').onclick = () => act(S && S.paused ? 'resume' : 'pause');
$('startstop').onclick = () => act(S && S.running ? 'stop' : 'start');

function openSheet(box) {
  if (!S || !S.running) { toast('Tap Start first.'); return; }
  sheetBox = box.box;
  $('sheetTitle').textContent = 'Box ' + box.box + (box.name ? ': ' + box.name : '');
  $('sLock').textContent = S.locked === box.box ? 'Unlock' : 'Lock here';
  $('sheet').hidden = false;
}
$('sCancel').onclick = () => $('sheet').hidden = true;
$('sheet').onclick = e => { if (e.target.id === 'sheet') $('sheet').hidden = true; };
$('sPlay').onclick = () => { $('sheet').hidden = true; act('play', sheetBox); };
$('sOn').onclick = () => { $('sheet').hidden = true; act('on', sheetBox); };
$('sLock').onclick = () => { $('sheet').hidden = true; act(S && S.locked === sheetBox ? 'unlock' : 'lock', sheetBox); };

function render() {
  const s = S;
  $('status').textContent = s.status;
  $('ask').hidden = !s.ask;
  if (s.ask) $('askText').textContent = 'Camera saw the sound move to box ' + s.ask + '. Is it there?';
  const g = $('grid'); g.innerHTML = '';
  g.style.gridTemplateColumns = s.layout === 2 ? '1fr 1fr' : '1fr 1fr';
  for (const b of s.boxes) {
    const d = document.createElement('div');
    d.className = 'box' + (s.running && s.box === b.box ? ' sound' : '');
    const chip = b.chip || 'NONE';
    d.innerHTML = '<div class="top"><span class="num"></span><span class="chip"></span><span class="sound-tag"></span></div>' +
      '<div class="name"></div><div class="detail"></div><div class="cam"></div>';
    d.querySelector('.num').textContent = b.box;
    const c = d.querySelector('.chip'); c.textContent = b.chip || '–'; c.classList.add(chip.replace(' ', ''));
    d.querySelector('.sound-tag').textContent = s.running && s.box === b.box ? (s.locked === b.box ? 'LOCKED' : 'SOUND') : '';
    d.querySelector('.name').textContent = b.name || 'No game set';
    d.querySelector('.detail').textContent = b.detail || '';
    const cam = d.querySelector('.cam');
    if (b.camera) { cam.textContent = 'Camera: ' + (b.camera === 'show' ? 'show, not the game' : b.camera); cam.classList.add(b.camera); }
    else if (b.reads) cam.textContent = 'Reads: ' + b.reads;
    d.onclick = () => openSheet(b);
    g.appendChild(d);
  }
  const heard = s.running ? (s.mic ? (s.heard === 'game' ? 'Game audio' : s.heard === 'commercial' ? 'Commercial' : 'Listening…') : 'Mic off') : 'Not listening';
  $('heard').textContent = heard + (s.running && s.mic && s.adPct >= 0 ? ' · commercial-like sound ' + s.adPct + '%' : '');
  $('heard').style.color = s.heard === 'commercial' && s.running ? 'var(--amber)' : (s.heard === 'game' && s.running ? 'var(--accent)' : 'var(--text)');
  $('why').textContent = s.why || s.error || s.remoteMsg || '';
  $('meter').style.width = (s.running && s.adPct >= 0 ? s.adPct : 0) + '%';
  $('meter').style.background = s.adPct >= 60 ? 'var(--amber)' : 'var(--accent)';
  $('pause').textContent = s.paused ? 'Resume' : 'Pause';
  $('pause').disabled = !s.running;
  $('startstop').textContent = s.running ? 'Stop' : (s.starting ? 'Starting…' : 'Start');
  const log = $('log'); log.innerHTML = '';
  for (const line of s.log) {
    const i = line.indexOf('  ');
    const row = document.createElement('div');
    const t = document.createElement('span'); t.textContent = i > 0 ? line.slice(0, i) : '';
    const m = document.createElement('span'); m.textContent = i > 0 ? line.slice(i + 2) : line;
    row.appendChild(t); row.appendChild(m); log.appendChild(row);
  }
  drawGrid();
}

async function poll() {
  try {
    const r = await fetch('/state?k=' + encodeURIComponent(K), { cache: 'no-store' });
    if (r.status === 403) { $('status').textContent = 'This link is out of date. Scan the code on the camera phone again.'; return; }
    S = await r.json(); failures = 0; render();
  } catch (e) {
    if (++failures >= 2) $('status').textContent = "Can't reach the camera phone. Is it on the same Wi-Fi with the app open?";
  }
}
setInterval(poll, 1000); poll();

// Camera view: what the camera phone sees, with the boxes as it reads them.
function lerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
function at(c, u, v) { const top = lerp(c[0], c[1], u), bot = lerp(c[3], c[2], u); return lerp(top, bot, v); }
function drawGrid() {
  const img = $('cam'), cv = $('ov');
  if (!S || !img.naturalWidth || !$('camPanel').open) return;
  cv.width = img.clientWidth * devicePixelRatio; cv.height = img.clientHeight * devicePixelRatio;
  const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, cv.width, cv.height);
  const f = S.corners; if (!f || f.length !== 8) return;
  const c = [[f[0], f[1]], [f[2], f[3]], [f[4], f[5]], [f[6], f[7]]].map(p => [p[0] * cv.width, p[1] * cv.height]);
  const rects = S.layout === 2 ? { 1: [0, 0, .5, 1], 2: [.5, 0, 1, 1] } : S.layout === 3 ? { 1: [0, 0, .66, 1], 2: [.66, 0, 1, .5], 3: [.66, .5, 1, 1] } :
    { 1: [0, 0, .5, .5], 2: [.5, 0, 1, .5], 3: [0, .5, .5, 1], 4: [.5, .5, 1, 1] };
  for (const b of S.boxes) {
    const r = rects[b.box]; if (!r) continue;
    const q = [at(c, r[0], r[1]), at(c, r[2], r[1]), at(c, r[2], r[3]), at(c, r[0], r[3])];
    ctx.beginPath(); ctx.moveTo(q[0][0], q[0][1]); for (const p of q.slice(1)) ctx.lineTo(p[0], p[1]); ctx.closePath();
    ctx.lineWidth = (S.running && S.box === b.box ? 5 : 2) * devicePixelRatio;
    ctx.strokeStyle = b.camera === 'game' ? '#2BD9A0' : b.camera === 'commercial' ? '#F5A524' : b.camera === 'show' ? '#6CB4FF' : 'rgba(255,255,255,.7)';
    ctx.stroke();
  }
}
function refreshCam() {
  if (!$('camPanel').open) return;
  const img = new Image();
  img.onload = () => { $('cam').src = img.src; setTimeout(drawGrid, 30); };
  img.src = '/frame.jpg?k=' + encodeURIComponent(K) + '&t=' + Date.now();
}
setInterval(refreshCam, 1500);
$('camPanel').addEventListener('toggle', refreshCam);

$('diag').onclick = async () => {
  try {
    const r = await fetch('/report?k=' + encodeURIComponent(K), { cache: 'no-store' });
    const t = await r.text();
    const ta = $('report'); ta.value = t; ta.hidden = false;
    let copied = false;
    if (navigator.clipboard && window.isSecureContext) { try { await navigator.clipboard.writeText(t); copied = true; } catch (e) {} }
    if (!copied) { ta.focus(); ta.select(); try { copied = document.execCommand('copy'); } catch (e) {} }
    toast(copied ? 'Diagnostics copied. Paste them into your chat.' : 'Select the text below and copy it.');
  } catch (e) { toast("Couldn't reach the camera phone."); }
};
</script>
</body>
</html>
