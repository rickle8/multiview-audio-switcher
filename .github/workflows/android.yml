name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download sound classifier model (YAMNet)
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/yamnet.tflite \
            https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MultiviewAudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MultiviewAudio-apk
          path: android/MultiviewAudio.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Multiview Audio 1.0.${{ github.run_number }}
          body: Download MultiviewAudio.apk on your Android phone and open it to install.
          files: android/MultiviewAudio.apk
          make_latest: true
