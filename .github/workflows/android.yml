name: Android app

on:
  push:
    # Every branch builds and tests; only main publishes a release.
    branches: ["**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download sound classifier model (YAMNet)
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/yamnet.tflite \
            https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite

      - name: Every pattern compiles on Android
        # Unit tests use desktop Java's regex engine; phones use ICU, which refuses some patterns
        # Java accepts (a refused pattern crashes the app). This checks them all with ICU.
        working-directory: .
        run: python3 .github/scripts/check_regex_android.py android/app/src/main/java

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Build APK
        run: gradle --no-daemon assembleRelease 2>&1 | tee -a ../build.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Report errors
        if: failure()
        working-directory: .
        run: python3 .github/scripts/report_errors.py

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MultiviewAudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MultiviewAudio-apk
          path: android/MultiviewAudio.apk

      - name: Publish as a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Multiview Audio 1.0.${{ github.run_number }}
          body: Download MultiviewAudio.apk on your Android phone and open it to install.
          files: android/MultiviewAudio.apk
          make_latest: true
