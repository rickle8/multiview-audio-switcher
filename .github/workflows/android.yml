name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download sound classifier model (YAMNet)
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/yamnet.tflite \
            https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Build APK
        run: gradle --no-daemon assembleRelease 2>&1 | tee -a ../build.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Report errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:" ../build.log | head -20 | while read -r line; do echo "::error::${line}"; done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for fl in list(tc.findall("failure")) + list(tc.findall("error")):
                  msg = (fl.get("message") or fl.text or "").splitlines()[0][:300]
                  print(f"::error::TEST {tc.get('name')}: {msg}")
          PY
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MultiviewAudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MultiviewAudio-apk
          path: android/MultiviewAudio.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Multiview Audio 1.0.${{ github.run_number }}
          body: Download MultiviewAudio.apk on your Android phone and open it to install.
          files: android/MultiviewAudio.apk
          make_latest: true
