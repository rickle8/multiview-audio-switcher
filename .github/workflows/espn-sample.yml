name: ESPN sample

on:
  push:
    branches: [main]
    paths: [".github/workflows/espn-sample.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch scoreboard and game summaries
        run: |
          mkdir -p out && cd out
          for i in 1 2 3; do
            curl -fsSL --compressed "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" -o sb_$i.json
            for id in $(python3 -c "import json;d=json.load(open('sb_$i.json'));print(' '.join(e['id'] for e in d['events'] if e['status']['type']['state'] in ('in','post'))[:200])"); do
              curl -fsSL --compressed "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=$id" -o sum_${id}_$i.json || true
            done
            [ $i -lt 3 ] && sleep 25
          done
          ls -la
      - name: Commit to espn-samples branch
        run: |
          cd out
          git init -q -b espn-samples
          git config user.name "sampler" && git config user.email "sampler@users.noreply.github.com"
          git add -A && git commit -qm "ESPN samples $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" espn-samples
